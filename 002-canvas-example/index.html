<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Canvas Image Scroll</title>
  <style>
    body, html {
      margin: 0;
      height: 200vh; /* so you can scroll the page */
    }
    canvas {
      display: block;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <canvas id="my-canvas" width="800" height="600"></canvas>
  <script defer src="index.js"></script>
</body>
</html>
